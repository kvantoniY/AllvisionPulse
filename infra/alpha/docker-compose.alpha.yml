services:
  postgres:
    image: postgres:16-alpine
    container_name: allvision-alpha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.alpha
    container_name: allvision-alpha-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TTL_MIN: ${ACCESS_TTL_MIN}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: ${UPLOAD_DIR}
      SOCKET_RECOVERY_MS: ${SOCKET_RECOVERY_MS}
      CALL_RECONNECT_GRACE_MS: ${CALL_RECONNECT_GRACE_MS}
      CALL_MAX_PARTICIPANTS: ${CALL_MAX_PARTICIPANTS}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${BACKEND_PORT}/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.alpha
    container_name: allvision-alpha-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT}
      HOSTNAME: 0.0.0.0
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.allvision-pulse.ru}
      ACCESS_TTL_MIN: ${ACCESS_TTL_MIN}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://allvision-pulse.ru}
      BACKEND_URL: http://backend:${BACKEND_PORT}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_APP_URL:-https://allvision-pulse.ru}
      NEXT_PUBLIC_TURN_URLS:
      NEXT_PUBLIC_TURN_USERNAME:
      NEXT_PUBLIC_TURN_PASSWORD:
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${FRONTEND_PORT}/auth/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: allvision-alpha-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.alpha.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro

volumes:
  postgres_data:
  uploads_data: