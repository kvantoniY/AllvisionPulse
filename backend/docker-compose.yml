version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: allvision_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - allvision_pulse_pg:/var/lib/postgresql/data
volumes:
  allvision_pulse_pg:
