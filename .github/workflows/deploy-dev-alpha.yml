name: Deploy alpha from dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-alpha-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.1
          package-manager-cache: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm config get registry

      - name: Build frontend on runner
        shell: bash
        env:
          NEXT_PUBLIC_BACKEND_URL: http://${{ secrets.ALPHA_HOST }}
          AUTH_COOKIE_SECURE: "false"
          NEXT_TELEMETRY_DISABLED: "1"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          cd frontend
          rm -rf node_modules .next
          npm ci --no-audit --no-fund
          test -f node_modules/next/dist/bin/next
          npm run build
          test -f .next/standalone/server.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ALPHA_SSH_PRIVATE_KEY }}" | perl -pe 's/\r$//' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host alpha
            HostName ${{ secrets.ALPHA_HOST }}
            User ${{ secrets.ALPHA_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes alpha "echo SSH_OK"

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR=/tmp/allvision-alpha-release
          ARCHIVE=/tmp/allvision-alpha-release.tgz
          rm -rf "$RELEASE_DIR"
          rm -f "$ARCHIVE"
          mkdir -p "$RELEASE_DIR"
          git archive --format=tar HEAD | tar -xf - -C "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/frontend"
          cp -R frontend/.next "$RELEASE_DIR/frontend/.next"
          tar -czf "$ARCHIVE" -C "$RELEASE_DIR" .
          scp "$ARCHIVE" alpha:/tmp/allvision-alpha-release.tgz

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          ssh alpha 'bash -s' <<'EOF'
          set -euo pipefail

          APP_ROOT=/opt/allvision-pulse
          CURRENT_DIR="$APP_ROOT/current"
          NEXT_DIR="$APP_ROOT/next"
          PREV_DIR="$APP_ROOT/previous"
          RELEASE_ARCHIVE=/tmp/allvision-alpha-release.tgz

          mkdir -p "$APP_ROOT"
          rm -rf "$NEXT_DIR"
          mkdir -p "$NEXT_DIR"
          tar -xzf "$RELEASE_ARCHIVE" -C "$NEXT_DIR"

          if [ -f "$CURRENT_DIR/infra/alpha/.env" ]; then
            mkdir -p "$NEXT_DIR/infra/alpha"
            cp "$CURRENT_DIR/infra/alpha/.env" "$NEXT_DIR/infra/alpha/.env"
          fi

          if [ -f "$NEXT_DIR/infra/alpha/.env" ]; then
            CORS_ORIGIN="http://${{ secrets.ALPHA_HOST }},https://${{ secrets.ALPHA_HOST }},http://allvision-pulse.ru,http://www.allvision-pulse.ru,https://allvision-pulse.ru,https://www.allvision-pulse.ru"
            if grep -q '^CORS_ORIGIN=' "$NEXT_DIR/infra/alpha/.env"; then
              sed -i "s|^CORS_ORIGIN=.*|CORS_ORIGIN=$CORS_ORIGIN|" "$NEXT_DIR/infra/alpha/.env"
            else
              printf '\nCORS_ORIGIN=%s\n' "$CORS_ORIGIN" >> "$NEXT_DIR/infra/alpha/.env"
            fi
          fi

          rm -rf "$PREV_DIR"
          if [ -d "$CURRENT_DIR" ]; then
            mv "$CURRENT_DIR" "$PREV_DIR"
          fi
          mv "$NEXT_DIR" "$CURRENT_DIR"
          cd "$CURRENT_DIR"

          if ! docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            up -d --build --remove-orphans; then
            if [ -d "$PREV_DIR" ]; then
              rm -rf "$CURRENT_DIR"
              mv "$PREV_DIR" "$CURRENT_DIR"
              cd "$CURRENT_DIR"
              docker compose \
                --project-name allvision-alpha \
                --env-file infra/alpha/.env \
                -f infra/alpha/docker-compose.alpha.yml \
                up -d --build --remove-orphans || true
            fi
            exit 1
          fi

          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            restart nginx

          echo "=== current CORS_ORIGIN ==="
          grep '^CORS_ORIGIN=' infra/alpha/.env || true

          echo "=== nginx health ==="
          curl --retry 10 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1/healthz >/dev/null

          echo "=== socket.io polling health ==="
          curl --retry 10 --retry-delay 2 --retry-connrefused -fsS "http://127.0.0.1/socket.io/?EIO=4&transport=polling" | grep -q "\"sid\""

          docker image prune -af --filter "until=72h" || true
          EOF

      - name: Backend diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          ssh alpha 'bash -s' <<'EOF'
          set +e
          APP_ROOT=/opt/allvision-pulse
          CURRENT_DIR="$APP_ROOT/current"
          cd "$CURRENT_DIR" || exit 0
          echo "=== docker compose ps ==="
          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            ps
          echo
          echo "=== backend logs ==="
          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            logs backend --tail=300
          echo
          echo "=== postgres logs ==="
          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            logs postgres --tail=120
          echo
          echo "=== frontend logs ==="
          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            logs frontend --tail=120
          echo
          echo "=== nginx logs ==="
          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            logs nginx --tail=120
          echo
          echo "=== nginx rendered config ==="
          NGINX_ID=$(docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            ps -q nginx)
          if [ -n "$NGINX_ID" ]; then
            docker exec "$NGINX_ID" nginx -T 2>/dev/null | sed -n "1,220p"
          fi
          echo
          echo "=== backend container id ==="
          BACKEND_ID=$(docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            ps -q backend)
          echo "$BACKEND_ID"
          if [ -n "$BACKEND_ID" ]; then
            echo
            echo "=== docker inspect state ==="
            docker inspect "$BACKEND_ID" --format '{{json .State}}'
            echo
            echo "=== docker inspect health ==="
            docker inspect "$BACKEND_ID" --format '{{json .State.Health}}'
          fi
          EOF
