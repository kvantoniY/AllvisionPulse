name: Deploy alpha from dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-alpha-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20.20.1
  PUBLIC_APP_URL: https://allvision-pulse.ru
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_DOMAIN: .allvision-pulse.ru
  TURN_HOST: turn.allvision-pulse.ru
  TURN_PORT: "3478"
  TURN_MIN_PORT: "49152"
  TURN_MAX_PORT: "49252"
  TURN_TTL_SEC: "43200"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm config get registry
          docker --version
          docker compose version

      - name: Validate alpha compose config
        run: |
          set -euo pipefail
          TEMP_ENV="$(mktemp)"
          cp infra/alpha/.env.example "${TEMP_ENV}"
          {
            echo "RELEASE_SHA=${GITHUB_SHA}"
            echo "AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}"
            echo "AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN}"
            echo "PUBLIC_APP_URL=${PUBLIC_APP_URL}"
            echo "TURN_HOST=${TURN_HOST}"
            echo "TURN_PORT=${TURN_PORT}"
            echo "TURN_MIN_PORT=${TURN_MIN_PORT}"
            echo "TURN_MAX_PORT=${TURN_MAX_PORT}"
            echo "TURN_TTL_SEC=${TURN_TTL_SEC}"
          } >> "${TEMP_ENV}"
          docker compose \
            --project-name allvision-alpha-ci \
            --env-file "${TEMP_ENV}" \
            -f infra/alpha/docker-compose.alpha.yml \
            config >/dev/null

      - name: Validate backend install and Prisma schema
        env:
          DATABASE_URL: postgresql://allvision:allvision@127.0.0.1:5432/allvision_pulse?schema=public
        run: |
          set -euo pipefail
          cd backend
          npm ci --no-audit --no-fund
          npx prisma validate --schema prisma/schema.prisma

      - name: Build frontend release archive
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ env.PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.PUBLIC_APP_URL }}
          PUBLIC_APP_URL: ${{ env.PUBLIC_APP_URL }}
          AUTH_COOKIE_SECURE: ${{ env.AUTH_COOKIE_SECURE }}
          AUTH_COOKIE_DOMAIN: ${{ env.AUTH_COOKIE_DOMAIN }}
          ACCESS_TTL_MIN: "15"
          REFRESH_TTL_DAYS: "30"
          NEXT_TELEMETRY_DISABLED: "1"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          bash infra/alpha/scripts/build-release.sh "${GITHUB_SHA}" "/tmp/allvision-alpha-release-${GITHUB_SHA}.tgz"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-release-${{ github.sha }}
          path: /tmp/allvision-alpha-release-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: alpha-release-${{ github.sha }}
          path: /tmp/alpha-release-artifact

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ALPHA_SSH_PRIVATE_KEY }}" | perl -pe 's/\r$//' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOFSSH
          Host alpha
            HostName ${{ secrets.ALPHA_HOST }}
            User ${{ secrets.ALPHA_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOFSSH
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes alpha "echo SSH_OK"

      - name: Show deploy target host
        run: |
          set -euo pipefail
          echo "ALPHA_HOST=${{ secrets.ALPHA_HOST }}"
          ssh alpha 'bash -s' <<'EOFREMOTE'
          set -euo pipefail
          echo "REMOTE_HOSTNAME=$(hostname)"
          echo "REMOTE_IPV4=$(hostname -I | xargs)"
          docker --version
          docker compose version
          EOFREMOTE

      - name: Generate fallback VAPID keys
        run: |
          set -euo pipefail
          node -e "const { createECDH } = require('crypto'); const curve = createECDH('prime256v1'); curve.generateKeys(); console.log('GENERATED_WEB_PUSH_VAPID_PUBLIC_KEY=' + curve.getPublicKey('base64url', 'uncompressed')); console.log('GENERATED_WEB_PUSH_VAPID_PRIVATE_KEY=' + curve.getPrivateKey('base64url'));" >> "${GITHUB_ENV}"

      - name: Upload release archive
        run: |
          set -euo pipefail
          scp "/tmp/alpha-release-artifact/allvision-alpha-release-${GITHUB_SHA}.tgz" "alpha:/tmp/allvision-alpha-release-${GITHUB_SHA}.tgz"

      - name: Deploy on server
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh alpha "RELEASE_SHA='${GITHUB_SHA}' RELEASE_ARCHIVE='/tmp/allvision-alpha-release-${GITHUB_SHA}.tgz' ALPHA_HOST='${{ secrets.ALPHA_HOST }}' PUBLIC_APP_URL='${PUBLIC_APP_URL}' AUTH_COOKIE_SECURE='${AUTH_COOKIE_SECURE}' AUTH_COOKIE_DOMAIN='${AUTH_COOKIE_DOMAIN}' TURN_HOST='${TURN_HOST}' TURN_PORT='${TURN_PORT}' TURN_MIN_PORT='${TURN_MIN_PORT}' TURN_MAX_PORT='${TURN_MAX_PORT}' TURN_TTL_SEC='${TURN_TTL_SEC}' GENERATED_WEB_PUSH_VAPID_PUBLIC_KEY='${GENERATED_WEB_PUSH_VAPID_PUBLIC_KEY}' GENERATED_WEB_PUSH_VAPID_PRIVATE_KEY='${GENERATED_WEB_PUSH_VAPID_PRIVATE_KEY}' bash -s" <<'EOFREMOTE'
          set -euo pipefail
          STAGING_DIR="/tmp/allvision-alpha-${RELEASE_SHA}"
          cleanup() {
            rm -rf "${STAGING_DIR}"
            rm -f "${RELEASE_ARCHIVE}"
          }
          trap cleanup EXIT
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"
          tar -xzf "${RELEASE_ARCHIVE}" -C "${STAGING_DIR}"
          cd "${STAGING_DIR}"
          bash infra/alpha/scripts/deploy-release.sh
          EOFREMOTE

      - name: Backend diagnostics
        if: always()
        run: |
          set +e
          cat infra/alpha/scripts/collect-runtime-diagnostics.sh | ssh alpha 'bash -s'

      - name: Verify public release
        run: |
          set -euo pipefail
          bash infra/alpha/scripts/verify-public-release.sh "${GITHUB_SHA}" "${PUBLIC_APP_URL}"

      - name: Public release diagnostics
        if: always()
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          set +e
          echo "=== dns ==="
          getent hosts allvision-pulse.ru || true
          echo
          echo "=== public release headers (strict TLS) ==="
          curl -svI -H 'Cache-Control: no-cache, no-store' "${PUBLIC_APP_URL}/api/release?ts=${EXPECTED_RELEASE_SHA}" 2>&1 || true
          echo
          echo "=== public release body (insecure fallback for diagnostics only) ==="
          curl -sk -H 'Cache-Control: no-cache, no-store' "${PUBLIC_APP_URL}/api/release?ts=${EXPECTED_RELEASE_SHA}" || true
          echo
          echo "=== public sw.js headers ==="
          curl -skI -H 'Cache-Control: no-cache, no-store' "${PUBLIC_APP_URL}/sw.js?ts=${EXPECTED_RELEASE_SHA}" || true
          echo
          echo "=== deployed vm localhost release ==="
          # shellcheck disable=SC2029
          ssh alpha "curl -fsS 'http://127.0.0.1/api/release?ts=${EXPECTED_RELEASE_SHA}' || true"
