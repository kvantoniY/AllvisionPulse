name: Deploy alpha from dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-alpha-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.ALPHA_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config <<EOF
          Host alpha
            HostName ${{ secrets.ALPHA_HOST }}
            User ${{ secrets.ALPHA_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF

          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes alpha "echo SSH_OK"

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=/tmp/allvision-alpha-release.tgz
          rm -f "$ARCHIVE"

          git archive --format=tar.gz -o "$ARCHIVE" HEAD

          scp "$ARCHIVE" alpha:/tmp/allvision-alpha-release.tgz

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          ssh alpha 'bash -s' <<'EOF'
          set -euo pipefail

          APP_ROOT=/opt/allvision-pulse
          CURRENT_DIR="$APP_ROOT/current"
          NEXT_DIR="$APP_ROOT/next"
          RELEASE_ARCHIVE=/tmp/allvision-alpha-release.tgz

          mkdir -p "$APP_ROOT"
          rm -rf "$NEXT_DIR"
          mkdir -p "$NEXT_DIR"

          tar -xzf "$RELEASE_ARCHIVE" -C "$NEXT_DIR"

          if [ -f "$CURRENT_DIR/infra/alpha/.env" ]; then
            mkdir -p "$NEXT_DIR/infra/alpha"
            cp "$CURRENT_DIR/infra/alpha/.env" "$NEXT_DIR/infra/alpha/.env"
          fi

          rm -rf "$CURRENT_DIR"
          mv "$NEXT_DIR" "$CURRENT_DIR"

          cd "$CURRENT_DIR"

          docker compose \
            --project-name allvision-alpha \
            --env-file infra/alpha/.env \
            -f infra/alpha/docker-compose.alpha.yml \
            up -d --build --remove-orphans

          docker image prune -af --filter "until=72h" || true
          EOF